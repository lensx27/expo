<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Pro</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* CONTENEDOR PRINCIPAL */
  #pantalla {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }

  /* TEXTO */
  #texto {
    width: 100%;
    max-width: 900px;
  }

  .linea {
    opacity: 0.3;
    font-size: clamp(20px, 4vw, 40px);
    margin: 10px 0;
    transition: all 0.3s ease;
  }

  .activa {
    opacity: 1;
    color: lime;
    font-size: clamp(28px, 6vw, 60px);
    font-weight: bold;
  }

  /* CONTROLES ABAJO */
  #controles {
    background: #111;
    padding: 10px;
    text-align: center;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  input {
    width: 80px;
    text-align: center;
    font-size: 16px;
  }
</style>

</head>
<body>

<div id="pantalla">
  <div id="texto"></div>
</div>

<div id="controles">
  <button onclick="iniciar()">▶ Iniciar</button>
  <button onclick="pausar()">⏸ Pausar</button>
  <button onclick="reiniciar()">🔄 Reiniciar</button>
  Velocidad(ms): <input type="number" id="velocidad" value="800">
</div>

<script>

const texto = `
> En el análisis 
del Sistema
 de Gestión 
de Tickets
 Digitales 
se identificaron
 los componentes 
necesarios para 
controlar 
el acceso 
y el consumo 
de raciones 
mediante
 códigos QR. 
Para organizar
 el sistema
 se definieron 
tres paquetes 
principales: 
Gestión de
 Acceso,
 encargado
 de la 
autenticación
 y validación
 de tickets;
 Gestión de
 Consumo, 
responsable
 del registro
 de raciones 
entregadas; 
y Administración y
 Reportes, orientado
 a la gestión de
 beneficiarios y
 generación de 
estadísticas.

También se
 identificaron
 las principales
 clases de entidad.
 La clase Usuario
 almacena la 
información de los beneficiarios y
 del personal
 autorizado.
 La clase Ticket
 contiene los 
códigos QR 
utilizados
 para el acceso.
 La clase Consumo
 registra cada 
entrega de ración,
 mientras que
 la clase Ración
 controla la
 disponibilidad 
de alimentos. 
Además, la clase
 Institución
 representa a las organizaciones
 con convenio activo
 y la clase Reporte
 consolida la
 información estadística
 necesaria para
 la gestión y facturación.

En las realizaciones
 de casos de
 uso destaca
 la validación 
del acceso
 mediante QR.
 El proceso 
inicia cuando
 el recepcionista
 escanea el código,
 el sistema 
verifica que
 el ticket sea
 válido y,
 si cumple las
 condiciones, registra
 el consumo 
correspondiente.
 Asimismo, el sistema
 permite generar 
reportes, registrar
 reservas y administrar usuarios.

Finalmente,
 el modelo 
conceptual muestra 
la relación entre
 las entidades.
 Un usuario puede
 tener tickets
 asociados, los 
tickets generan 
registros de consumo
 y estos se 
relacionan 
con una ración 
específica. 
Las instituciones 
agrupan usuarios
 y los reportes
 utilizan 
la información 
de consumo
 para generar 
indicadores de gestión
. De esta manera
, el modelo
 representa de 
forma clara 
la estructura
 y funcionamiento
 general del sistema.
`;

let lineas = texto.split("\n").filter(l => l.trim() !== "");
let index = 0;
let intervalo = null;

function iniciar() {
  if (intervalo) return;
  mostrar();
}

function pausar() {
  clearTimeout(intervalo);
  intervalo = null;
}

function reiniciar() {
  pausar();
  index = 0;
  document.getElementById("texto").innerHTML = "";
}

function mostrar() {
  if (index >= lineas.length) return;

  let contenedor = document.getElementById("texto");

  // mantener máximo 5 líneas visibles
  if (contenedor.children.length >= 5) {
    contenedor.removeChild(contenedor.firstChild);
  }

  let div = document.createElement("div");
  div.className = "linea";
  div.innerText = lineas[index];

  contenedor.appendChild(div);

  // quitar activa anterior
  let todas = document.querySelectorAll(".linea");
  todas.forEach(el => el.classList.remove("activa"));

  // activar última (centro visual)
  div.classList.add("activa");

  index++;

  let vel = document.getElementById("velocidad").value;
  intervalo = setTimeout(mostrar, vel);
}

</script>

</body>
</html>
