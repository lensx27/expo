<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Pro</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ===== PANTALLA DE PRESENTACIÓN ===== */
  #pantalla {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
    padding: 20px;
    position: relative;
  }

  #texto {
    width: 100%;
    max-width: 900px;
  }

  .palabra-actual {
    opacity: 1;
    color: lime;
    font-size: clamp(36px, 8vw, 90px);
    font-weight: bold;
    line-height: 1.2;
  }

  /* ===== CUENTA REGRESIVA ===== */
  #cuenta {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: black;
    font-size: clamp(80px, 20vw, 200px);
    font-weight: bold;
    color: orange;
  }

  /* ===== PANEL DE EDICIÓN DE TEXTO ===== */
  #panelTexto {
    background: #111;
    padding: 12px;
    border-bottom: 1px solid #333;
  }

  #panelTexto textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }

  #panelTexto .fila {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  /* ===== CONTROLES ABAJO ===== */
  #controles {
    background: #111;
    padding: 10px;
    text-align: center;
    border-top: 1px solid #333;
  }

  .fila-controles {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }

  button {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #333;
    color: white;
  }

  button:hover { background: #444; }

  button.principal { background: #2e7d32; }
  button.principal:hover { background: #388e3c; }

  input, select {
    padding: 8px;
    text-align: center;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: white;
  }

  input[type="number"] { width: 80px; }

  label { font-size: 14px; color: #ccc; }
</style>

</head>
<body>

<div id="panelTexto">
  <label for="entradaTexto">Pega o escribe tu texto aquí:</label>
  <textarea id="entradaTexto" placeholder="Escribe o pega el texto que quieres leer en el teleprompter..."></textarea>
  <div class="fila">
    <button class="principal" onclick="cargarTexto()">📥 Cargar texto</button>
    <label>Palabras por grupo:
      <select id="tamGrupo">
        <option value="2">2</option>
        <option value="3" selected>3 (o menos si son largas)</option>
      </select>
    </label>
    <span id="estadoCarga" style="color:#8f8;"></span>
  </div>
</div>

<div id="pantalla">
  <div id="texto"></div>
  <div id="cuenta"></div>
</div>

<div id="controles">
  <div class="fila-controles">
    <button class="principal" onclick="iniciarConCuenta()">▶ Iniciar</button>
    <button onclick="pausar()">⏸ Pausar</button>
    <button onclick="reiniciar()">🔄 Reiniciar</button>
  </div>
  <div class="fila-controles">
    <label>Velocidad (ms por grupo):
      <input type="number" id="velocidad" value="800" min="100" step="50">
    </label>
    <label>Cuenta regresiva:
      <select id="cuentaRegresiva">
        <option value="3">3 s</option>
        <option value="5" selected>5 s</option>
        <option value="10">10 s</option>
      </select>
    </label>
  </div>
</div>

<script>

const textoPorDefecto = `Pega o escribe tu propio texto arriba y presiona "Cargar texto" para comenzar.`;

let grupos = [];
let index = 0;
let temporizador = null;

// ===== CARGAR Y AGRUPAR TEXTO =====
function cargarTexto() {
  pausar();
  reiniciar();

  let texto = document.getElementById("entradaTexto").value.trim();
  if (!texto) texto = textoPorDefecto;

  const tam = parseInt(document.getElementById("tamGrupo").value, 10);
  grupos = agruparPalabras(texto, tam);

  document.getElementById("estadoCarga").innerText =
    `✅ ${grupos.length} grupos listos`;
}

// Agrupa palabras de a 2 o 3, pero reduce el grupo si las palabras son muy largas
function agruparPalabras(texto, tamMax) {
  const palabras = texto
    .replace(/\s+/g, " ")
    .trim()
    .split(" ")
    .filter(p => p.length > 0);

  const LIMITE_CARACTERES = 18; // ancho aproximado cómodo para pantalla
  const resultado = [];
  let actual = [];

  for (const palabra of palabras) {
    const posible = [...actual, palabra].join(" ");

    const excedeCaracteres = posible.length > LIMITE_CARACTERES;
    const excedeCantidad = actual.length >= tamMax;

    if (actual.length > 0 && (excedeCaracteres || excedeCantidad)) {
      resultado.push(actual.join(" "));
      actual = [palabra];
    } else {
      actual.push(palabra);
    }
  }

  if (actual.length > 0) resultado.push(actual.join(" "));

  return resultado;
}

// ===== CUENTA REGRESIVA =====
function iniciarConCuenta() {
  if (temporizador) return; // ya está corriendo

  if (grupos.length === 0) cargarTexto();
  if (grupos.length === 0) return;

  const segundos = parseInt(document.getElementById("cuentaRegresiva").value, 10);
  const cuentaDiv = document.getElementById("cuenta");
  cuentaDiv.style.display = "flex";

  let restante = segundos;
  cuentaDiv.innerText = restante;

  const intervaloCuenta = setInterval(() => {
    restante--;
    if (restante > 0) {
      cuentaDiv.innerText = restante;
    } else {
      clearInterval(intervaloCuenta);
      cuentaDiv.style.display = "none";
      mostrar();
    }
  }, 1000);
}

// ===== CONTROL DE REPRODUCCIÓN =====
function pausar() {
  clearTimeout(temporizador);
  temporizador = null;
}

function reiniciar() {
  pausar();
  index = 0;
  document.getElementById("texto").innerHTML = "";
  document.getElementById("cuenta").style.display = "none";
}

function mostrar() {
  if (index >= grupos.length) {
    document.getElementById("texto").innerHTML =
      '<div class="palabra-actual" style="color:#888;font-size:32px;">✅ Fin del texto</div>';
    return;
  }

  const contenedor = document.getElementById("texto");
  contenedor.innerHTML = "";

  const div = document.createElement("div");
  div.className = "palabra-actual";
  div.innerText = grupos[index];
  contenedor.appendChild(div);

  index++;

  const vel = parseInt(document.getElementById("velocidad").value, 10) || 800;
  temporizador = setTimeout(mostrar, vel);
}

</script>

</body>
</html>
