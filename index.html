<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Pro</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* CONTENEDOR PRINCIPAL */
  #pantalla {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }

  /* TEXTO */
  #texto {
    width: 100%;
    max-width: 900px;
  }

  .linea {
    opacity: 0.3;
    font-size: clamp(20px, 4vw, 40px);
    margin: 10px 0;
    transition: all 0.3s ease;
  }

  .activa {
    opacity: 1;
    color: lime;
    font-size: clamp(28px, 6vw, 60px);
    font-weight: bold;
  }

  /* CONTROLES ABAJO */
  #controles {
    background: #111;
    padding: 10px;
    text-align: center;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  input {
    width: 80px;
    text-align: center;
    font-size: 16px;
  }
</style>

</head>
<body>

<div id="pantalla">
  <div id="texto"></div>
</div>

<div id="controles">
  <button onclick="iniciar()">▶ Iniciar</button>
  <button onclick="pausar()">⏸ Pausar</button>
  <button onclick="reiniciar()">🔄 Reiniciar</button>
  Velocidad(ms): <input type="number" id="velocidad" value="800">
</div>

<script>

const texto = `
✅ Subtema: Presentación

Contenido:
“Hola, muy buenos días/tardes. Mi nombre es [Tu Nombre y Apellidos] y en este avance de portafolio continúo desarrollando mi investigación sobre el ecosistema seleccionado: Lago Titicaca, el cual elegí en mi trabajo anterior.”

✅ Subtema: Objetivo

Contenido:
“El objetivo de esta presentación es identificar, describir y explicar los principales impactos ambientales que afectan a este importante cuerpo de agua, detallando sus causas, las zonas más degradadas y las consecuencias ambientales, económicas y sociales que estos problemas generan.”
📌 ESTRUCTURA: CONTENIDO

✅ Subtema: Datos generales del ecosistema

Contenido:
“El Lago Titicaca se ubica en la meseta del Collao, en la región de Puno, frontera entre Perú y Bolivia. Es considerado el lago navegable más alto del mundo, a más de 3 800 metros sobre el nivel del mar. Es un ecosistema estratégico y vital: es fuente de agua dulce, regula el clima de la zona, alberga una gran biodiversidad y es el sustento principal de miles de familias que viven de la pesca, la agricultura y el turismo.”

✅ Subtema: 
Identifica los
 impactos ambientales


“Los principales
 impactos
 ambientales 
que afectan 
al lago son:

• Contaminación
 del agua:
 Es el problema
 más crítico, 
por vertimiento
 de desechos.

• Eutrofización: 
Exceso de
 nutrientes
 que provoca
 crecimiento 
excesivo de
 plantas acuáticas
 como el lirio.

• Sobreexplotación
 de recursos: 
Pesca excesiva
 que reduce 
las poblaciones
 de peces 
nativos.

• Disminución 
del nivel 
del agua: 
Por cambios 
climáticos y 
uso desmedido.

• Acumulación de
 residuos sólidos:
 Basura en orillas
 y aguas 
poco profundas.”

✅ Subtema: Áreas
 degradadas (HAS)

Contenido:
“Según información
 del MINAM 
y la Autoridad
 Nacional 
del Agua, 
las zonas 
más degradadas 
y afectadas
 se ubican en:

• Las bahías 
cercanas a la
 ciudad de Puno
 y Juliaca.

• Las zonas 
cercanas a 
los ríos que 
desembocan en
 el lago, 
como el río
 Coata y 
el río Ilave.

• Las orillas
 donde se 
concentran 
asentamientos 
humanos y 
actividades 
agrícolas.

• También hay 
degradación 
severa en 
las zonas 
de los 
humedales 
circundantes.”

✅ Subtema: 
Causas de 
los impactos
 ambientales 
(Antrópicas 
– Naturales)

Contenido:
“Las causas 
se dividen 
en dos 
grupos:

🔹 Causas Antrópicas (provocadas 
por el 
ser humano): 
Son la causa
 principal.
 Destacan el 
vertimiento de
 aguas residuales
 sin tratamiento,
 el uso 
excesivo de
 fertilizantes y
 agroquímicos en
 la agricultura,
 la pesca 
sin control,
 la acumulación
 de basura
 y 
el crecimiento
 urbano
 desordenado.
 Todas estas
 actividades
 introducen
 sustancias 
dañinas y 
alteran la 
calidad del agua.

🔹 Causas Naturales:
 Factores como 
el calentamiento global,
 la disminución
 de lluvias y
 la variabilidad
 climática, 
que reducen
 los aportes 
de agua, 
y la erosión natural
 de las laderas
 que arrastra
 sedimentos 
hacia el lago.”

✅ Subtema: 
Consecuencias del
 Impacto Ambiental
“Los efectos
 negativos afectan
 a todo el
 ecosistema y
 a las personas:
✅ Sobre seres vivos: Desaparición 
de especies
 nativas como
 el pez 
carachi y
 el mauri,
 disminución de
 aves acuáticas,
 muerte de plantas 
y animales
 por falta
 de oxígeno 
en el agua,
 y pérdida 
de biodiversidad
 única de
 la zona
 altoandina.
✅ Sobre el 
entorno físico:
 Deterioro de 
la calidad 
del agua, 
acumulación 
de lodos,
 crecimiento
 descontrolado
 de plantas 
acuáticas,
 reducción
 del volumen 
de agua y
 pérdida de capacidad
 para regular
 el clima local.”

📌 ESTRUCTURA: CIERRE

✅ Subtema: Conclusiones y reflexiones

Contenido:
“En conclusión,
 el Lago Titicaca
 es un 
patrimonio natural
 invaluable,
 pero se
 encuentra en
 riesgo crítico
 debido 
principalmente a 
nuestras 
actividades. 
He aprendido
 que el daño
 no solo afecta al
 agua, 
sino que pone
 en peligro 
la economía,
 la cultura
 y la salud 
de toda 
la población 
que depende de él.
 Protegerlo 
es urgente 
y requiere 
el compromiso
 de todos: 
autoridades, 
comunidades 
y ciudadanos.`;

let lineas = texto.split("\n").filter(l => l.trim() !== "");
let index = 0;
let intervalo = null;

function iniciar() {
  if (intervalo) return;
  mostrar();
}

function pausar() {
  clearTimeout(intervalo);
  intervalo = null;
}

function reiniciar() {
  pausar();
  index = 0;
  document.getElementById("texto").innerHTML = "";
}

function mostrar() {
  if (index >= lineas.length) return;

  let contenedor = document.getElementById("texto");

  // mantener máximo 5 líneas visibles
  if (contenedor.children.length >= 5) {
    contenedor.removeChild(contenedor.firstChild);
  }

  let div = document.createElement("div");
  div.className = "linea";
  div.innerText = lineas[index];

  contenedor.appendChild(div);

  // quitar activa anterior
  let todas = document.querySelectorAll(".linea");
  todas.forEach(el => el.classList.remove("activa"));

  // activar última (centro visual)
  div.classList.add("activa");

  index++;

  let vel = document.getElementById("velocidad").value;
  intervalo = setTimeout(mostrar, vel);
}

</script>

</body>
</html>
